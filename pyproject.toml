[project]
name = "pydantic-v2-copilot"
version = "0.1.0"
description = "Multi-Agent RAG Copilot for Modern Python & Pydantic v2 Migration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "google-genai>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "groq>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage", "src/core_agents", "src/copilot_api"]
