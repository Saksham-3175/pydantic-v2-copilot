[project]
name = "pydantic-v2-copilot"
version = "0.1.0"
description = "Multi-Agent RAG Copilot for Modern Python & Pydantic v2 Migration"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Saksham Shukla" }]
keywords = ["pydantic", "fastapi", "rag", "qdrant", "multi-agent", "migration", "ast", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "google-genai>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "groq>=1.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
copilot = "copilot_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage", "src/core_agents", "src/copilot_api", "src/copilot_cli"]
